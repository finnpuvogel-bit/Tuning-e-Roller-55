<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninebot WebBluetooth Tuner | G3 • ZT3 Pro • F3 Pro</title>
    <style>
        :root {
            --bg: #090a0f;
            --card-bg: #12151e;
            --border: #212738;
            --accent: #ff3b30;
            --accent-green: #30d158;
            --text-main: #f2f4f8;
            --text-muted: #8e9bb0;
            --console-bg: #050608;
            --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-mono);
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .dashboard {
            width: 100%;
            max-width: 540px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: var(--accent);
            font-size: 1.25rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .panel {
            background: #0d0f16;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value-badge {
            float: right;
            color: var(--accent);
            font-weight: bold;
        }

        select, input[type="range"], button {
            width: 100%;
            padding: 12px;
            background: #171b26;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            outline: none;
            margin-bottom: 12px;
        }

        select:focus, input[type="range"]:focus {
            border-color: var(--accent);
        }

        button {
            background: var(--accent);
            color: #fff;
            font-weight: bold;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-bottom: 0;
        }

        button:active {
            transform: scale(0.98);
        }

        button.btn-flash {
            background: var(--accent-green);
            color: #000;
        }

        .info-tag {
            font-size: 0.7rem;
            color: var(--accent-green);
            background: rgba(48, 209, 88, 0.1);
            border: 1px solid rgba(48, 209, 88, 0.2);
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            display: block;
        }

        #console {
            height: 140px;
            background: var(--console-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            font-size: 0.72rem;
            color: var(--accent-green);
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            margin-right: 6px;
        }

        .status-dot.active {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <h1>Ninebot BLE Tuner</h1>
        <p>Vercel Edition • Multi-Model Unlock Engine</p>
    </div>

    <div class="panel">
        <label for="modelSelect">Target Hardware Profile</label>
        <select id="modelSelect" onchange="updateProfileInfo()">
            <option value="G3">Ninebot Max G3 (36V / 48V Unlock)</option>
            <option value="ZT3">Ninebot ZT3 Pro (Dual-Stage Field Weakening)</option>
            <option value="F3">Ninebot F3 Pro (High Torque Urban)</option>
        </select>

        <span class="info-tag" id="profileBadge">Profile: Ninebot Max G3 — Baud: 115200</span>

        <button id="btnConnect" onclick="handleConnect()">
            <span class="status-dot" id="statusDot"></span>
            <span id="btnText">Connect Scooter via BLE</span>
        </button>
    </div>

    <div class="panel">
        <label>Speed Limit <span class="value-badge" id="speedVal">45 km/h</span></label>
        <input type="range" id="speedRange" min="20" max="65" value="45" oninput="document.getElementById('speedVal').innerText = this.value + ' km/h'">

        <label>Field Weakening Current <span class="value-badge" id="fwVal">28 A</span></label>
        <input type="range" id="fwRange" min="0" max="45" value="28" oninput="document.getElementById('fwVal').innerText = this.value + ' A'">

        <button class="btn-flash" onclick="flashParameters()">Write Config to Scooter</button>
    </div>

    <div class="panel">
        <label>Terminal / GATT Telemetry</label>
        <div id="console">> AXIOM WebBluetooth Stack Ready. Select profile & hit connect.</div>
    </div>
</div>

<script>
    const NINEBOT_SERVICE = '0000e000-0000-1000-8000-00805f9b34fb';
    const NINEBOT_TX      = '0000e001-0000-1000-8000-00805f9b34fb';
    const NINEBOT_RX      = '0000e002-0000-1000-8000-00805f9b34fb';

    let device = null;
    let rxCharacteristic = null;
    let txCharacteristic = null;

    const PROFILES = {
        'G3': { name: 'Ninebot Max G3', regionByte: 0x01, badge: 'Profile: Max G3 — 36V/48V FW Profile' },
        'ZT3': { name: 'Ninebot ZT3 Pro', regionByte: 0x02, badge: 'Profile: ZT3 Pro — High-Output Profile' },
        'F3': { name: 'Ninebot F3 Pro', regionByte: 0x03, badge: 'Profile: F3 Pro — High Torque Profile' }
    };

    function sysLog(msg) {
        const consoleEl = document.getElementById('console');
        consoleEl.innerText += '\n> ' + msg;
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function updateProfileInfo() {
        const key = document.getElementById('modelSelect').value;
        document.getElementById('profileBadge').innerText = PROFILES[key].badge;
        sysLog(`Loaded model configuration profile: ${PROFILES[key].name}`);
    }

    function calcChecksum(buf) {
        let sum = 0;
        for (let i = 0; i < buf.length; i++) {
            sum += buf[i];
        }
        return sum ^ 0xFFFF;
    }

    function encodePacket(cmd, payload) {
        const len = payload.length + 2;
        const frame = [0x55, 0xAA, len, 0x20, cmd, ...payload];
        const chk = calcChecksum(frame.slice(2));
        frame.push(chk & 0xFF, (chk >> 8) & 0xFF);
        return new Uint8Array(frame);
    }

    async function handleConnect() {
        if (device && device.gatt.connected) {
            device.gatt.disconnect();
            sysLog('BLE connection closed manually.');
            document.getElementById('btnText').innerText = 'Connect Scooter via BLE';
            document.getElementById('statusDot').classList.remove('active');
            return;
        }

        try {
            sysLog('Scanning BLE devices with prefix NB/Ninebot/Segway...');
            device = await navigator.bluetooth.requestDevice({
                filters: [
                    { namePrefix: 'NB' },
                    { namePrefix: 'Ninebot' },
                    { namePrefix: 'Segway' }
                ],
                optionalServices: [NINEBOT_SERVICE]
            });

            sysLog(`Target device found: ${device.name}. Establishing GATT tunnel...`);
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(NINEBOT_SERVICE);

            rxCharacteristic = await service.getCharacteristic(NINEBOT_RX);
            txCharacteristic = await service.getCharacteristic(NINEBOT_TX);

            await rxCharacteristic.startNotifications();
            rxCharacteristic.addEventListener('characteristicvaluechanged', (e) => {
                const hex = Array.from(new Uint8Array(e.target.value.buffer))
                    .map(b => b.toString(16).padStart(2, '0')).join(' ');
                sysLog(`RX Telemetry: ${hex}`);
            });

            sysLog('BLE Tunnel established! Ready to flash parameters.');
            document.getElementById('btnText').innerText = 'Disconnect BLE';
            document.getElementById('statusDot').classList.add('active');

        } catch (err) {
            sysLog(`BLE Error / Connection Refused: ${err.message}`);
        }
    }

    async function flashParameters() {
        const modelKey = document.getElementById('modelSelect').value;
        const targetSpeed = parseInt(document.getElementById('speedRange').value);
        const fwCurrent = parseInt(document.getElementById('fwRange').value);
        const profile = PROFILES[modelKey];

        sysLog(`Building hex payload for ${profile.name}...`);
        const payload = [profile.regionByte, targetSpeed, fwCurrent, 0x7E];
        const packet = encodePacket(0x78, payload);

        const hexString = Array.from(packet).map(b => b.toString(16).padStart(2, '0')).join(' ');
        sysLog(`Generated Packet: ${hexString}`);

        if (txCharacteristic && device && device.gatt.connected) {
            await txCharacteristic.writeValue(packet);
            sysLog('SUCCESS: Parameters written directly to Ninebot controller memory!');
        } else {
            sysLog('SIMULATION MODE: Packet compiled successfully. Connect BLE to execute hardware flash.');
        }
    }
</script>
</body>
</html>
